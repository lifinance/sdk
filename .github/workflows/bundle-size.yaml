name: Bundle size

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.editorconfig'
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit is checked out. Its first parent is the exact base commit.
          fetch-depth: 2
          # The job runs PR-controlled build code, so the token must not stay in .git/config.
          persist-credentials: false
      - name: Find the base commit
        id: base
        # HEAD is the PR merge commit, so its first parent is the exact base.
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          # This job can write PR comments, so it must not restore a shared cache.
          cache: 'false'
      - name: Build PR
        run: pnpm build
      - name: Measure PR
        id: head
        run: |
          set +e
          node scripts/size-measure.mjs . "$RUNNER_TEMP/head.json"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Build base
        id: base_build
        # A broken base only means "no baseline". The report and budgets still run.
        continue-on-error: true
        env:
          HUSKY: '0'
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build
      - name: Measure base
        # A half-built base would give a misleading baseline, so skip it.
        if: steps.base_build.outcome == 'success'
        # The base is measured with the PR's checks. Checks for files the base lacks are skipped.
        run: node scripts/size-measure.mjs "$RUNNER_TEMP/base" "$RUNNER_TEMP/base.json" --ignore-missing || true
      - name: Build report
        # Also run when a build failed, so the PR comment never shows a stale result.
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BUILD_OUTCOME: ${{ steps.base_build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/size-report.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" > "$RUNNER_TEMP/size.md"
          cat "$RUNNER_TEMP/size.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        # Fork PRs get a read-only token. They still get the job summary above.
        # Bot PRs (Dependabot, Renovate) also get a read-only token, so a failed comment
        # must not hide the budget result.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: bundle-size
          path: ${{ runner.temp }}/size.md
      - name: Enforce budgets
        if: ${{ !cancelled() && steps.head.outputs.status != '0' }}
        env:
          STATUS: ${{ steps.head.outputs.status }}
        run: |
          if [ "$STATUS" = "1" ]; then
            echo "::error::A bundle size budget is exceeded, or a check produced no output. See the job summary or the PR comment."
          else
            echo "::error::The size measurement failed (exit $STATUS). See the 'Measure PR' step log."
          fi
          exit 1
