overrides:
  axios: ^1.21.0
  ws@<=8.22.2: 8.22.2
  # @lifi/data-types 7.2.2 pins @lifi/types 18.15.0 exactly. Keep one copy with
  # the range that @lifi/sdk asks for.
  '@lifi/data-types>@lifi/types': ^18.16.0
  # zod 4.1.12 is an optional peer of abitype that stayed in the lockfile;
  # 4.6.0 fixes all three Aikido advisories.
  'zod@<4.6.0': '>=4.6.0'
allowBuilds:
  esbuild: false
# 2026-11-09: viem 2.57.17 is taken inside the age window on purpose. 2.57.16 adds a
# literal import('mppx/client') for an optional peer, which some bundlers cannot resolve.
# 2.57.17 fixes it (wevm/viem#5437). Remove the entry when it ages out.
minimumReleaseAgeExclude:
  - viem@2.57.17
  - '@lifi/*'
