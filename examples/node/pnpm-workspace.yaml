overrides:
  axios: ^1.21.1
  ws@<=8.23.0: 8.23.0
  # @lifi/data-types 8.0.0 pins @lifi/types 19.0.0 exactly, and @lifi/sdk 4.13.0
  # asks for ^19.1.0. Keep one copy with the range that the published @lifi/sdk
  # asks for. Move this range with it, and remove it when @lifi/data-types
  # accepts that range.
  '@lifi/data-types>@lifi/types': ^19.1.0
  # zod 4.1.12 is an optional peer of abitype that stayed in the lockfile;
  # 4.6.0 fixes all three Aikido advisories.
  'zod@<4.6.0': '>=4.6.0'
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - '@lifi/*'
