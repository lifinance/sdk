packages:
  - packages/*
allowBuilds:
  esbuild: false
  msw: true
  nx: true
#   - 2026-11-12: fast-track @biomejs/biome@2.6.7, @biomejs/cli-android-arm64@2.6.7, @biomejs/cli-android-x64@2.6.7, @biomejs/cli-darwin-arm64@2.6.7, @biomejs/cli-darwin-x64@2.6.7, @biomejs/cli-linux-arm64-musl@2.6.7, @biomejs/cli-linux-arm64@2.6.7, @biomejs/cli-linux-x64-musl@2.6.7, @biomejs/cli-linux-x64@2.6.7, @biomejs/cli-win32-arm64@2.6.7, @biomejs/cli-win32-x64@2.6.7, viem@2.57.19 (all checks pass, or approved by the user).
minimumReleaseAgeExclude:
  - '@bigmi/*'
  - '@lifi/*'
  - '@biomejs/biome@2.6.7'
  - '@biomejs/cli-android-arm64@2.6.7'
  - '@biomejs/cli-android-x64@2.6.7'
  - '@biomejs/cli-darwin-arm64@2.6.7'
  - '@biomejs/cli-darwin-x64@2.6.7'
  - '@biomejs/cli-linux-arm64@2.6.7'
  - '@biomejs/cli-linux-arm64-musl@2.6.7'
  - '@biomejs/cli-linux-x64@2.6.7'
  - '@biomejs/cli-linux-x64-musl@2.6.7'
  - '@biomejs/cli-win32-arm64@2.6.7'
  - '@biomejs/cli-win32-x64@2.6.7'
  - viem@2.57.19
overrides:
  axios: ^1.21.1
  ws@<=8.22.2: 8.22.2
  # @lifi/data-types 7.2.2 pins @lifi/types 18.15.0 exactly. Keep one copy with
  # the range that @lifi/sdk asks for.
  '@lifi/data-types>@lifi/types': ^18.16.0
  # Security (Aikido), 2026-10-12, unflagged copies. Each key has a selector that
  # covers only the advisory's affected range. These change what this repo's tests
  # use, not what consumers of @lifi/sdk-provider-tron install.
  # tronweb 6.2.2 and 6.5.1 pin validator 13.15.23 exactly.
  'validator@<13.15.26': '>=13.15.26'
  # Forced major (unflagged copy). tronweb 6.2.2 and 6.5.1 pin google-protobuf
  # 3.21.4 exactly; no tronweb release fixes it. A TRX and a TRC-20 round trip give
  # the same bytes on 4.x.
  'google-protobuf@<4.0.3': '^4.0.3'
  # Security, 2026-11-10 (JUMEMB-199, GHSA-g3hv-75wg-m249, fixed only in 11.0.1).
  # Forced major on one path: @typescript-eslint/typescript-estree (via madge, dev
  # only) asks for ^10.2.2 up to 8.72.2. It calls only the named minimatch(), which
  # 11.x keeps, also in CJS. The path selector leaves other minimatch majors alone.
  # Remove it when typescript-estree allows minimatch 11.
  '@typescript-eslint/typescript-estree>minimatch': '^11.0.5'
