packages:
  - packages/*
allowBuilds:
  esbuild: false
  msw: true
  nx: true
#   - 2026-11-16: fast-track @oxlint/binding-android-arm-eabi@1.94.0, @oxlint/binding-android-arm64@1.94.0, @oxlint/binding-darwin-arm64@1.94.0, @oxlint/binding-darwin-x64@1.94.0, @oxlint/binding-freebsd-x64@1.94.0, @oxlint/binding-linux-arm-gnueabihf@1.94.0, @oxlint/binding-linux-arm-musleabihf@1.94.0, @oxlint/binding-linux-arm64-gnu@1.94.0, @oxlint/binding-linux-arm64-musl@1.94.0, @oxlint/binding-linux-ppc64-gnu@1.94.0, @oxlint/binding-linux-riscv64-gnu@1.94.0, @oxlint/binding-linux-riscv64-musl@1.94.0, @oxlint/binding-linux-s390x-gnu@1.94.0, @oxlint/binding-linux-x64-gnu@1.94.0, @oxlint/binding-linux-x64-musl@1.94.0, @oxlint/binding-openharmony-arm64@1.94.0, @oxlint/binding-win32-arm64-msvc@1.94.0, @oxlint/binding-win32-ia32-msvc@1.94.0, @oxlint/binding-win32-x64-msvc@1.94.0, oxlint@1.94.0 (approved by the user).
minimumReleaseAgeExclude:
  - '@bigmi/*'
  - '@lifi/*'
  - '@oxlint/binding-android-arm-eabi@1.94.0'
  - '@oxlint/binding-android-arm64@1.94.0'
  - '@oxlint/binding-darwin-arm64@1.94.0'
  - '@oxlint/binding-darwin-x64@1.94.0'
  - '@oxlint/binding-freebsd-x64@1.94.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.94.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.94.0'
  - '@oxlint/binding-linux-arm64-gnu@1.94.0'
  - '@oxlint/binding-linux-arm64-musl@1.94.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.94.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.94.0'
  - '@oxlint/binding-linux-riscv64-musl@1.94.0'
  - '@oxlint/binding-linux-s390x-gnu@1.94.0'
  - '@oxlint/binding-linux-x64-gnu@1.94.0'
  - '@oxlint/binding-linux-x64-musl@1.94.0'
  - '@oxlint/binding-openharmony-arm64@1.94.0'
  - '@oxlint/binding-win32-arm64-msvc@1.94.0'
  - '@oxlint/binding-win32-ia32-msvc@1.94.0'
  - '@oxlint/binding-win32-x64-msvc@1.94.0'
  - oxlint@1.94.0
overrides:
  axios: ^1.21.1
  ws@<=8.23.0: 8.23.0
  # @lifi/data-types 8.0.0 pins @lifi/types 19.0.0 exactly. Keep one copy with
  # the range that @lifi/sdk asks for.
  '@lifi/data-types>@lifi/types': ^19.1.0
  # Security (Aikido), 2026-10-12, unflagged copies. Each key has a selector that
  # covers only the advisory's affected range. These change what this repo's tests
  # use, not what consumers of @lifi/sdk-provider-tron install.
  # tronweb 6.2.2 and 6.5.1 pin validator 13.15.23 exactly.
  'validator@<13.15.26': '>=13.15.26'
  # Forced major (unflagged copy). tronweb 6.2.2 and 6.5.1 pin google-protobuf
  # 3.21.4 exactly; no tronweb release fixes it. A TRX and a TRC-20 round trip give
  # the same bytes on 4.x.
  'google-protobuf@<4.0.3': '^4.0.3'
