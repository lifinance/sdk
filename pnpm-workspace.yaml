packages:
  - packages/*
allowBuilds:
  esbuild: false
  msw: true
  nx: true
#   - 2026-11-18: fast-track @vitest/browser-playwright@5.1.1, @vitest/browser-preview@5.1.1, @vitest/browser@5.1.1, @vitest/coverage-istanbul@5.1.1, @vitest/coverage-v8@5.1.1, @vitest/mocker@5.1.1, @vitest/pretty-format@5.1.1, @vitest/spy@5.1.1, @vitest/ui@5.1.1, @vitest/utils@5.1.1, msw@3.0.7, vitest@5.1.1 (all checks pass).
minimumReleaseAgeExclude:
  - '@bigmi/*'
  - '@lifi/*'
  - '@vitest/browser@5.1.1'
  - '@vitest/browser-playwright@5.1.1'
  - '@vitest/browser-preview@5.1.1'
  - '@vitest/coverage-istanbul@5.1.1'
  - '@vitest/coverage-v8@5.1.1'
  - '@vitest/mocker@5.1.1'
  - '@vitest/pretty-format@5.1.1'
  - '@vitest/spy@5.1.1'
  - '@vitest/ui@5.1.1'
  - '@vitest/utils@5.1.1'
  - msw@3.0.7
  - vitest@5.1.1
overrides:
  axios: ^1.21.1
  ws@<=8.23.0: 8.23.0
  # @lifi/data-types 8.0.0 pins @lifi/types 19.0.0 exactly. Keep one copy with
  # the range that @lifi/sdk asks for.
  '@lifi/data-types>@lifi/types': ^19.1.0
  # Security (Aikido), 2026-10-12, unflagged copies. Each key has a selector that
  # covers only the advisory's affected range. These change what this repo's tests
  # use, not what consumers of @lifi/sdk-provider-tron install.
  # tronweb 6.2.2 and 6.5.1 pin validator 13.15.23 exactly.
  'validator@<13.15.26': '>=13.15.26'
  # Forced major (unflagged copy). tronweb 6.2.2 and 6.5.1 pin google-protobuf
  # 3.21.4 exactly; no tronweb release fixes it. A TRX and a TRC-20 round trip give
  # the same bytes on 4.x.
  'google-protobuf@<4.0.3': '^4.0.3'
  # @inquirer/core 12.1.1 (from msw) moved back to mute-stream ^3 to keep Node 20
  # support (SBoudrias/Inquirer.js#2449). This repo runs on Node 24, so keep 4.0.0.
  # Remove this when @inquirer/core asks for mute-stream ^4 again.
  mute-stream: 4.0.0
